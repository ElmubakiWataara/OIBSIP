<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a secure Guardly account." />
    <title>Create account | EsofaSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-art" aria-hidden="true">
        <a class="brand inverse" href="/login"><span>✦</span> Esofa Space</a>
        <div class="art-copy">
          <p>Built around your privacy</p>
          <h1>Create an account<br />you can <em>trust.</em></h1>
          <!-- <small
            >Your password is salted and hashed before it reaches the
            database.</small
          > -->
        </div>
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="grid-lines"></div>
      </section>
      <section class="auth-panel">
        <a class="brand mobile-brand" href="/login"
          ><span>✦</span> Esofa Space</a
        >
        <div class="form-wrap">
          <p class="eyebrow">Get started</p>
          <h2>Create your account.</h2>
          <p class="form-intro">
            A few details now, then your secure dashboard is ready.
          </p>
          <form id="register-form" novalidate>
            <label for="name"
              >Your name<input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                placeholder="e.g. Abdul Barki"
                required /></label
            ><label for="username"
              >Username<input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="3–24 characters"
                required /></label
            ><label for="email"
              >Email address<input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="name@example.com"
                required /></label
            ><label for="password"
              >Password
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="At least 8 characters and 1 number"
                  required
                /><button
                  class="password-toggle"
                  type="button"
                  data-password-toggle="password"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div></label
            >
            <p class="password-rule">
              <span>✓</span> Minimum 8 characters, including at least 1 number.
            </p>
            <p
              class="form-status"
              id="form-status"
              role="alert"
              aria-live="polite"
            ></p>
            <button class="primary-button" type="submit">Create account</button>
          </form>
          <p class="switch-page">
            Already registered? <a href="/login">Sign in</a>
          </p>
        </div>
      </section>
    </main>
    <script src="/assets/auth.js"></script>
  </body>
</html>
